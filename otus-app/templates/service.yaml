apiVersion: v1
kind: Service
metadata:
  name: otus-app-service
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    app: otus-app
spec:
  type: {{ .Values.app.service.type }}
  selector:
    app: otus-app
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.app.service.port }}
      targetPort: 8000