apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otus-app-monitor
  namespace: m
  labels:
    app: otus-app
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: otus-app
  namespaceSelector:
    matchNames:
      - m
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s