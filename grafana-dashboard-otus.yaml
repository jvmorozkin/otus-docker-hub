apiVersion: v1
kind: ConfigMap
metadata:
  name: otus-app-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  otus-app-dashboard.json: |-
    {
      "title": "OTUS App Monitoring Dashboard",
      "editable": true,
      "panels": [
        {
          "id": 2,
          "title": "Application Latency (by quantiles)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{job=\"otus-app-service\", uri!~\".*actuator.*\"}[5m])) by (le, uri)) * 1000",
              "legendFormat": "0.99 {{uri}}"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{job=\"otus-app-service\", uri!~\".*actuator.*\"}[5m])) by (le, uri)) * 1000",
              "legendFormat": "0.95 {{uri}}"
            },
            {
              "expr": "histogram_quantile(0.5, sum(rate(http_server_requests_seconds_bucket{job=\"otus-app-service\", uri!~\".*actuator.*\"}[5m])) by (le, uri)) * 1000",
              "legendFormat": "0.5 {{uri}}"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
        },
        {
          "id": 3,
          "title": "Application RPS by endpoint",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{job=\"otus-app-service\", uri!~\".*actuator.*\"}[5m])) by (uri, method)",
              "legendFormat": "{{method}} {{uri}}"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
        },
        {
          "id": 4,
          "title": "Application Error Rate (5xx) by endpoint",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{job=\"otus-app-service\", status=~\"5..\", uri!~\".*actuator.*\"}[5m])) by (uri, method)",
              "legendFormat": "5xx {{method}} {{uri}}"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
        },
        {
          "id": 5,
          "title": "NGINX Ingress Latency",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(nginx_ingress_controller_request_duration_seconds_bucket[5m])) by (le)) * 1000",
              "legendFormat": "0.99 quantile"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(nginx_ingress_controller_request_duration_seconds_bucket[5m])) by (le)) * 1000",
              "legendFormat": "0.95 quantile"
            },
            {
              "expr": "histogram_quantile(0.5, sum(rate(nginx_ingress_controller_request_duration_seconds_bucket[5m])) by (le)) * 1000",
              "legendFormat": "0.5 quantile"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
        },
        {
          "id": 6,
          "title": "NGINX Ingress RPS",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum(rate(nginx_ingress_controller_requests[5m]))",
              "legendFormat": "Total RPS"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16}
        },
        {
          "id": 7,
          "title": "NGINX Ingress Error Rate",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum(rate(nginx_ingress_controller_requests{status=~\"5..\"}[5m]))",
              "legendFormat": "5xx errors"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16}
        },
        {
          "id": 8,
          "title": "Application CPU Usage",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"m\", pod=~\"otus-app.*\"}[5m])) by (pod)",
              "legendFormat": "CPU {{pod}}"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24}
        },
        {
          "id": 9,
          "title": "Application Memory Usage",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"m\", pod=~\"otus-app.*\"}) by (pod) / 1024 / 1024",
              "legendFormat": "Memory {{pod}} (MB)"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24}
        },
        {
          "id": 10,
          "title": "PostgreSQL Connections",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "pg_stat_database_numbackends{datname=\"otus\"}",
              "legendFormat": "Connections"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 32}
        },
        {
          "id": 11,
          "title": "PostgreSQL Query Rate",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "rate(pg_stat_database_tup_fetched{datname=\"otus\"}[5m])",
              "legendFormat": "Queries/s"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 32}
        }
      ],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": "label_values(up, namespace)",
            "refresh": 1,
            "type": "query",
            "includeAll": true,
            "multi": true
          },
          {
            "name": "pod",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": "label_values(up{namespace=~\"$namespace\"}, pod)",
            "refresh": 1,
            "type": "query",
            "includeAll": true,
            "multi": true
          },
          {
            "name": "ingress",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": "label_values(nginx_ingress_controller_requests, ingress)",
            "refresh": 1,
            "type": "query",
            "includeAll": true,
            "multi": true
          }
        ]
      },
      "time": {"from": "now-6h", "to": "now"}
    }